<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>TravelMate</title></head><body><div id="root"></div><script>window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:"en",includedLanguages:"en,hi,kn,ta,te",autoDisplay:false,multilanguagePage:true}, "google_translate_element");};window.changeTravelMateLanguage=function(lang){const tryChange=()=>{const combo=document.querySelector(".goog-te-combo");if(!combo){setTimeout(tryChange,300);return;}combo.value={English:"en",Hindi:"hi",Kannada:"kn",Tamil:"ta",Telugu:"te"}[lang]||"en";combo.dispatchEvent(new Event("change"));};tryChange();};</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script><script type="module" src="/src/main.jsx"></script></body></html>
